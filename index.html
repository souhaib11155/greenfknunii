<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uni Revise | Your study space</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');
:root{--bg:#f4f7f2;--surface:#fff;--surface2:#edf4ed;--ink:#1d3028;--muted:#77877e;--line:#e2eae2;--accent:#286048;--accent2:#639779;--accentSoft:#dcebe0;--shadow:0 18px 55px #163d2914;--glow:#9ac7a5;--top:#214d3c}
[data-theme="dark"]{--bg:#101a17;--surface:#192722;--surface2:#21362d;--ink:#edf5ef;--muted:#a1b2a7;--line:#30463b;--accent:#8bc6a0;--accent2:#b1dbb9;--accentSoft:#294536;--shadow:0 18px 55px #0006;--glow:#76b98c;--top:#0c1512}
[data-theme="forest"]{--bg:#e9f0e4;--surface:#f8fbf4;--surface2:#dce9d5;--ink:#213b2c;--muted:#71836e;--line:#cfddc9;--accent:#315f3e;--accent2:#709a62;--accentSoft:#d6e6cf;--shadow:0 18px 55px #24462817;--glow:#9fbe87;--top:#244c31}
[data-theme="midnight"]{--bg:#15172a;--surface:#20233c;--surface2:#2b3050;--ink:#f1f0ff;--muted:#aaaed0;--line:#393d5e;--accent:#b4a5ff;--accent2:#8a7ce0;--accentSoft:#383458;--shadow:0 18px 55px #08091880;--glow:#a99cff;--top:#111329}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;overflow-x:hidden;transition:background .45s,color .45s}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;opacity:.22;background-image:radial-gradient(var(--accent2) .8px,transparent .8px);background-size:24px 24px;mask-image:linear-gradient(#000,transparent 80%)}
.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}.orb{position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(75px);opacity:.13;background:var(--glow);animation:orbFloat 18s ease-in-out infinite alternate}.orb.one{top:-150px;left:-130px}.orb.two{right:-150px;top:35%;width:430px;height:430px;animation-delay:-7s}.orb.three{left:35%;bottom:-280px;width:380px;height:380px;animation-delay:-12s}
.topline{height:6px;background:linear-gradient(90deg,var(--top),var(--accent2),#d6b979,var(--accent));background-size:300% 100%;animation:gradient 9s linear infinite}
header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(6vw,22px);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;transition:background .4s}
.brand{display:flex;align-items:center;gap:11px;font:700 23px 'Playfair Display';cursor:pointer;letter-spacing:-.5px}.logo{height:39px;width:39px;border-radius:14px;background:linear-gradient(145deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white;box-shadow:0 7px 20px color-mix(in srgb,var(--accent) 30%,transparent);font:700 21px 'Playfair Display';animation:logoPulse 4s ease-in-out infinite}
.header-actions{display:flex;align-items:center;gap:10px}.theme-select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:500 12px 'DM Sans';outline:none;cursor:pointer}.theme-select:focus{border-color:var(--accent2)}
.btn{padding:11px 17px;border-radius:12px;background:var(--accent);color:white;font-weight:700;font-size:12px;box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 22%,transparent);transition:transform .25s,box-shadow .25s,filter .25s}.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 13px 25px color-mix(in srgb,var(--accent) 28%,transparent);filter:brightness(1.08)}.btn:active{transform:scale(.97)}.btn.secondary{background:var(--surface2);color:var(--accent);box-shadow:none}.btn.ghost{background:transparent;color:var(--accent);box-shadow:none}
main{max-width:1120px;margin:0 auto;padding:45px 26px 100px;min-height:calc(100vh - 145px)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:42px 44px;margin-bottom:38px;background:linear-gradient(118deg,var(--top),var(--accent) 68%,var(--accent2));color:white;box-shadow:0 22px 65px color-mix(in srgb,var(--accent) 25%,transparent);animation:heroEnter .9s cubic-bezier(.2,.8,.2,1) both}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff30;border-radius:50%;width:370px;height:370px;right:-85px;top:-205px;animation:ring 18s linear infinite}.hero:after{width:240px;height:240px;right:110px;top:110px;animation-direction:reverse;animation-duration:23s}
.hero .eyeline{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#d2e8d7;font-weight:700}.hero h1{font:700 clamp(34px,5vw,51px)/1.1 'Playfair Display';max-width:620px;margin:15px 0}.hero p{color:#e0eee3;max-width:540px;line-height:1.8;font-size:14px;margin:0}.hero .star{position:absolute;right:19%;top:35%;font-size:39px;animation:starDance 5s ease-in-out infinite}.hero .hero-orbit{position:absolute;right:7%;bottom:-70px;width:190px;height:190px;border:1px solid #ffffff30;border-radius:50%;animation:ring 25s linear infinite}
.hero .hero-orbit:before,.hero .hero-orbit:after{content:"✦";position:absolute;color:#d7ebd8}.hero .hero-orbit:before{top:8px;left:24px}.hero .hero-orbit:after{right:20px;bottom:27px}
.breadcrumb{font-size:12px;color:var(--muted);margin:0 0 18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.breadcrumb span{color:var(--accent);cursor:pointer}.breadcrumb span:hover{text-decoration:underline}
.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-bottom:9px}.page-title{font:700 clamp(28px,4vw,38px) 'Playfair Display';margin:0 0 8px;letter-spacing:-.5px}.sub{color:var(--muted);margin:0 0 28px;font-size:13px;line-height:1.75}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.choice{position:relative;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:19px;padding:23px;min-height:151px;box-shadow:0 4px 18px #00000008;overflow:hidden;animation:cardEnter .65s both;animation-delay:calc(var(--i)*.12s);transition:transform .3s,border-color .3s,box-shadow .3s}
.choice:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,color-mix(in srgb,var(--accentSoft) 60%,transparent),transparent 80%);transform:translateX(-120%);transition:transform .7s}.choice:hover:before{transform:translateX(120%)}.choice:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:var(--accentSoft);right:-52px;bottom:-65px;transition:.45s}.choice:hover{transform:translateY(-8px) rotate(-.5deg);border-color:var(--accent2);box-shadow:var(--shadow)}.choice:hover:after{transform:scale(1.8)}
.symbol{width:42px;height:42px;border-radius:14px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font:700 16px 'Playfair Display';margin-bottom:17px;position:relative;z-index:1;transition:transform .35s}.choice:hover .symbol{transform:rotate(-10deg) scale(1.12)}.choice strong{display:block;font:700 20px 'Playfair Display';position:relative;z-index:1}.choice small{display:block;color:var(--muted);font-size:11px;margin-top:6px;position:relative;z-index:1}
.section-row{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:30px 0 15px}.section-row h2{font:700 22px 'Playfair Display';margin:0}.level-list,.module-list{display:grid;gap:11px}
.level,.module{display:flex;align-items:center;gap:16px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:17px 19px;width:100%;transition:transform .28s,border-color .28s,box-shadow .28s;animation:slideIn .55s both;animation-delay:calc(var(--i)*.09s)}
.level:hover,.module:hover{transform:translateX(7px);border-color:var(--accent2);box-shadow:var(--shadow)}
.level-code,.module-num{flex:none;width:43px;height:43px;border-radius:14px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;transition:transform .3s}.level:hover .level-code,.module:hover .module-num{transform:rotate(8deg) scale(1.08)}
.level-copy,.module-copy{flex:1}.level-copy strong,.module-copy strong{font:700 17px 'Playfair Display';display:block}.level-copy small,.module-copy small{color:var(--muted);font-size:11px;display:block;margin-top:5px}.arrow{font-size:24px;color:var(--accent2);transition:transform .25s}.level:hover .arrow{transform:translateX(5px)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 17px;flex-wrap:wrap}.tabs{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:12px}.tabs button{background:transparent;padding:9px 15px;border-radius:9px;color:var(--muted);font-size:11px;font-weight:700;transition:.25s}.tabs button:hover{color:var(--accent)}.tabs button.active{background:var(--surface);color:var(--accent);box-shadow:0 3px 9px #00000012}
.search{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;min-width:min(270px,100%);outline:none;font:inherit;font-size:12px;transition:.25s}.search:focus{border-color:var(--accent2);box-shadow:0 0 0 4px var(--accentSoft)}
.module{padding:19px}.module-num{width:40px;height:40px}.module-copy em{font-style:normal;font-size:9px;color:var(--muted);letter-spacing:1.2px;display:block;margin-bottom:4px}.open-label{font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-size:12px;font-weight:700;margin:0 0 22px;cursor:pointer;transition:gap .2s}.back:hover{gap:14px}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:24px 0}.category{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:17px;padding:17px;text-align:left;transition:transform .28s,border-color .28s,background .28s;min-height:130px;animation:cardEnter .5s both;animation-delay:calc(var(--i)*.1s)}.category:hover,.category.active{transform:translateY(-5px);border-color:var(--accent2);background:var(--surface2);box-shadow:var(--shadow)}.cat-icon{width:36px;height:36px;border-radius:12px;background:var(--accentSoft);display:grid;place-items:center;margin-bottom:12px;color:var(--accent);font-size:16px;transition:transform .35s}.category:hover .cat-icon{transform:rotate(-12deg) scale(1.1)}.category strong{display:block;font:700 16px 'Playfair Display'}.category small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.files-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.files-head h3{font:700 21px 'Playfair Display';margin:0}.files-head span{font-size:11px;color:var(--muted)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:19px;text-align:center;padding:45px 20px;color:var(--muted);animation:fadeUp .6s}.empty .file-icon{font-size:32px;margin-bottom:11px;animation:bob 3s ease-in-out infinite}.empty strong{display:block;color:var(--ink);font-size:13px;margin-bottom:8px}
.file-row{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;animation:fadeUp .4s}.file-row .file-icon{width:41px;height:41px;background:var(--accentSoft);border-radius:12px;display:grid;place-items:center}.file-info{flex:1;min-width:0}.file-info strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis}.file-info small{color:var(--muted);font-size:10px}
.admin-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:21px;margin-top:25px}.admin-panel h3{font:700 20px 'Playfair Display';margin:0 0 7px}.admin-panel p{font-size:11px;color:var(--muted);line-height:1.7}.upload-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.file-input{max-width:250px;font-size:11px;color:var(--muted)}.note{font-size:10px;color:#b38b4d!important;margin-top:13px}
footer{padding:26px;text-align:center;color:var(--muted);font-size:10px;border-top:1px solid var(--line)}footer b{color:var(--accent)}
.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--accent);color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:12px;z-index:60;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-back{position:fixed;inset:0;background:#071c14a8;backdrop-filter:blur(7px);display:none;place-items:center;z-index:50;padding:20px}.modal-back.show{display:grid;animation:fade .2s}.modal{width:min(420px,100%);background:var(--surface);color:var(--ink);border-radius:22px;padding:27px;box-shadow:0 25px 80px #0005;animation:pop .35s}.modal h2{font:700 26px 'Playfair Display';margin:0 0 8px}.modal p{font-size:12px;color:var(--muted);line-height:1.6}.modal input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;margin:8px 0 15px;background:var(--bg);color:var(--ink);font:inherit}
.hidden{display:none!important}
@keyframes heroEnter{from{opacity:0;transform:translateY(24px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes cardEnter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes orbFloat{0%{transform:translate(0,0) scale(.9)}100%{transform:translate(100px,80px) scale(1.2)}}
@keyframes ring{to{transform:rotate(360deg)}}@keyframes starDance{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(35deg) scale(1.25)}}
@keyframes logoPulse{0%,100%{box-shadow:0 7px 20px color-mix(in srgb,var(--accent) 25%,transparent)}50%{box-shadow:0 7px 28px color-mix(in srgb,var(--accent) 55%,transparent)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes gradient{to{background-position:300% 0}}
@media(max-width:720px){header{height:68px;padding:0 15px}.brand{font-size:19px}.logo{width:35px;height:35px}.header-actions{gap:6px}.theme-select{max-width:112px;padding:9px 7px;font-size:10px}.btn{padding:10px 12px}main{padding:27px 15px 70px}.hero{padding:30px 24px;border-radius:22px}.hero .star{right:12%;top:17%}.grid{grid-template-columns:1fr}.choice{min-height:125px}.category-grid{grid-template-columns:repeat(2,1fr)}.category{min-height:119px}.page-title{font-size:29px}.level,.module{padding:14px;gap:12px}.level-copy strong,.module-copy strong{font-size:15px}.module-copy small{font-size:10px}.section-row{align-items:start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="ambient"><i class="orb one"></i><i class="orb two"></i><i class="orb three"></i></div><div class="topline"></div>
<header>
 <div class="brand" onclick="goHome()"><div class="logo">u.</div>uni revise</div>
 <div class="header-actions">
  <select class="theme-select" id="themePicker" aria-label="Choose theme" onchange="setTheme(this.value)"><option value="light">☀ Light sage</option><option value="dark">☾ Dark mode</option><option value="forest">❧ Forest green</option><option value="midnight">✦ Midnight</option></select>
  <button class="btn" id="authBtn" onclick="openAuth()">Sign In</button>
 </div>
</header>
<main id="app"></main><footer>Made for curious minds · <b>uni revise</b> · <span id="year"></span><br><span style="display:inline-block;margin-top:9px;letter-spacing:.4px">Designed & developed by <b>Souhaib</b> ✦</span></footer>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modal"><div class="modal"><h2 id="modalTitle">Welcome back</h2><p>Enter your name to personalise your study space.</p><input id="nameInput" placeholder="Your name" autocomplete="name"><div style="display:flex;gap:9px"><button class="btn" style="flex:1" onclick="saveAuth()">Continue</button><button class="btn secondary" onclick="closeAuth()">Cancel</button></div></div></div>
<script>
const modules=[
 {code:'L1-01',name:'Oral',desc:'First-year oral expression, listening comprehension, and pronunciation practice.'},
 {code:'L1-02',name:'Written Expression',desc:'Sentence structure, paragraph unity, and foundational academic writing.'},
 {code:'L1-03',name:'ICT',desc:'Information and communication technologies for academic research and digital literacy.'},
 {code:'L1-04',name:'Linguistics & Phonetics',desc:'Introduction to general linguistics, articulatory phonetics, and IPA transcription.'},
 {code:'L1-05',name:'Study Skills',desc:'University note-taking, time management, reading strategies, and exam preparation.'}
];
const levels={Licence:[['L1','First Year Licence','English LMD Foundation · 10 modules'],['L2','Second Year Licence','English LMD Core · 9 modules'],['L3','Third Year Licence','English LMD Specialization · 9 modules']],Master:[['M1','First Year Master','Master 1'],['M2','Second Year Master','Master 2']],Doctoral:[['D1','Doctoral Studies','Doctoral programme']]};
const cats=[['TD','Directed work & drills','▤'],['Course','Lectures & handouts','▣'],['Quiz','Practice & self-checks','◉'],['Exam','Past papers & keys','♧']];
let state={program:'Licence',level:'L1',module:null,category:'Course',page:'program',user:localStorage.getItem('ur-user')||''};
let uploads=JSON.parse(localStorage.getItem('ur-files')||'{}');
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('ur-theme',t);document.getElementById('themePicker').value=t;toast(t==='dark'?'Dark mode enabled':t==='forest'?'Forest theme enabled':t==='midnight'?'Midnight theme enabled':'Light theme enabled')}
function render(){let app=document.getElementById('app');if(state.page==='program')app.innerHTML=programPage();if(state.page==='level')app.innerHTML=levelPage();if(state.page==='modules')app.innerHTML=modulesPage();if(state.page==='module')app.innerHTML=modulePage();document.getElementById('authBtn').textContent=state.user?'Sign Out':'Sign In';document.getElementById('year').textContent=new Date().getFullYear()}
function hero(){return `<section class="hero"><div class="eyeline">University of 8 Mai 1945 · Guelma</div><h1>Your next chapter<br>starts here.</h1><p>A calmer, clearer place to collect your study materials, practise what you learn, and feel ready for what comes next.</p><span class="star">✳</span><i class="hero-orbit"></i></section>`}
function crumbs(items){return `<div class="breadcrumb">${items.map((x,i)=>`${i?'<b>›</b>':''}<span ${x[1]?`onclick="${x[1]}"`:''}>${x[0]}</span>`).join('')}</div>`}
function programPage(){return `${hero()}<div class="eyebrow">01 · Choose your path</div><h1 class="page-title">Your academic journey</h1><p class="sub">Choose your study programme to find the right revision materials.</p><div class="grid">${[['Licence','L','Undergraduate programme'],['Master','M','Postgraduate programme'],['Doctoral','D','Doctoral studies']].map((x,i)=>`<button class="choice" style="--i:${i}" onclick="pickProgram('${x[0]}')"><span class="symbol">${x[1]}</span><strong>${x[0]}</strong><small>${x[2]}</small></button>`).join('')}</div>`}
function levelPage(){return `${crumbs([['Programs','goHome()'],[state.program,'']])}<div class="eyebrow">02 · ${state.program}</div><h1 class="page-title">${state.program} · Choose Level</h1><p class="sub">Select your year to explore its modules and revision materials.</p><div class="level-list">${levels[state.program].map((x,i)=>`<button class="level" style="--i:${i}" onclick="pickLevel('${x[0]}')"><span class="level-code">${x[0]}</span><span class="level-copy"><strong>${x[0]} · ${x[1]}</strong><small>${x[2]}</small></span><span class="arrow">›</span></button>`).join('')}</div>`}
function modulesPage(){let isLicence=state.program==='Licence';return `${crumbs([['Programs','goHome()'],[state.program,'goLevels()'],[state.level,'']])}<div class="eyebrow">${state.program} · ${state.level}</div><h1 class="page-title">${state.level} · English LMD Modules</h1><p class="sub">Tap a module to open its TD, Course, Quiz, and Exam sections.</p><div class="toolbar"><div class="tabs">${(isLicence?['L1','L2','L3']:levels[state.program].map(x=>x[0])).map(l=>`<button class="${state.level===l?'active':''}" onclick="pickLevel('${l}')">${l}</button>`).join('')}</div><input class="search" id="moduleSearch" placeholder="⌕  Filter modules or codes..." oninput="filterModules(this.value)"></div><div class="module-list" id="moduleList">${modules.map((m,i)=>moduleCard(m,i)).join('')}</div><p class="sub" style="font-size:10px;margin-top:15px">The supplied screen recording shows these five module names. The module count shown for each year is retained from the reference; additional module names can be added when you provide them.</p>`}
function moduleCard(m,i){let code=m.code.replace('L1',state.level);return `<button class="module" style="--i:${i}" data-search="${(m.name+' '+code).toLowerCase()}" onclick="pickModule('${code}')"><span class="module-num">${String(i+1).padStart(2,'0')}</span><span class="module-copy"><em>${code} · v1.0</em><strong>${m.name}</strong><small>${m.desc}</small></span><span class="open-label">Open&nbsp; ›</span></button>`}
function modulePage(){let m=modules.find(x=>x.code.replace('L1',state.level)===state.module)||modules[0];let key=fileKey(state.module,state.category),files=uploads[key]||[];return `${crumbs([['Programs','goHome()'],[state.program,'goLevels()'],[state.level,'goModules()'],[m.name,'']])}<div class="back" onclick="goModules()">← &nbsp;Back to ${state.level} Modules</div><div class="eyebrow">${state.program} ${state.level} · ${state.module} · v1.0</div><h1 class="page-title">${m.name}</h1><p class="sub">${m.desc}</p><div class="category-grid">${cats.map((c,i)=>`<button class="category ${state.category===c[0]?'active':''}" style="--i:${i}" onclick="pickCategory('${c[0]}')"><span class="cat-icon">${c[2]}</span><strong>${i+1}. ${c[0]}</strong><small>${c[1]}</small><small style="margin-top:9px">${(uploads[fileKey(state.module,c[0])]||[]).length} files</small></button>`).join('')}</div><div class="files-head"><h3>${state.category} · Uploaded Files</h3><span>${files.length} ${files.length===1?'item':'items'}</span></div><div id="fileList">${files.length?files.map((f,i)=>`<div class="file-row"><div class="file-icon">▧</div><div class="file-info"><strong>${escapeHtml(f.name)}</strong><small>${formatSize(f.size)} · ${f.date}</small></div><button class="btn secondary" onclick="downloadFile('${key}',${i})">Download</button></div>`).join(''):`<div class="empty"><div class="file-icon">▤</div><strong>No files uploaded in ${state.category} yet</strong>Check back once your instructor uploads materials to this section.</div>`}</div><section class="admin-panel"><h3>Manage study materials</h3><p>Add a PDF, document, image, or other revision file to this section. In this prototype, files are saved in this browser.</p><div class="upload-row"><input class="file-input" type="file" id="uploadFile"><button class="btn" onclick="uploadFile()">＋ Add file</button></div><p class="note">For shared uploads across all students, connect a database and cloud file storage before publishing.</p></section>`}
function fileKey(code,cat){return code+'-'+cat}
function pickProgram(p){state.program=p;state.page='level';render();window.scrollTo({top:0,behavior:'smooth'})}
function pickLevel(l){state.level=l;state.page='modules';render();window.scrollTo({top:0,behavior:'smooth'})}
function pickModule(code){state.module=code;state.category='Course';state.page='module';render();window.scrollTo({top:0,behavior:'smooth'})}
function pickCategory(c){state.category=c;render()}
function goHome(){state.page='program';render();window.scrollTo({top:0,behavior:'smooth'})}
function goLevels(){state.page='level';render()}
function goModules(){state.page='modules';render()}
function filterModules(q){document.querySelectorAll('.module').forEach(el=>el.style.display=el.dataset.search.includes(q.toLowerCase())?'flex':'none')}
function uploadFile(){let input=document.getElementById('uploadFile'),f=input.files[0];if(!f){toast('Choose a file first.');return}let key=fileKey(state.module,state.category),reader=new FileReader();reader.onload=()=>{uploads[key]=uploads[key]||[];uploads[key].push({name:f.name,size:f.size,date:new Date().toLocaleDateString(),data:reader.result});try{localStorage.setItem('ur-files',JSON.stringify(uploads));render();toast('File added successfully.')}catch(e){toast('Storage is full. Try a smaller file.')}};reader.readAsDataURL(f)}
function downloadFile(key,i){let f=uploads[key][i],a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function formatSize(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function openAuth(){if(state.user){state.user='';localStorage.removeItem('ur-user');render();toast('Signed out.');return}document.getElementById('modal').classList.add('show')}
function closeAuth(){document.getElementById('modal').classList.remove('show')}
function saveAuth(){let n=document.getElementById('nameInput').value.trim();if(!n){toast('Enter your name to continue.');return}state.user=n;localStorage.setItem('ur-user',n);closeAuth();render();toast('Welcome, '+n+'!')}
let savedTheme=localStorage.getItem('ur-theme')||'light';document.documentElement.dataset.theme=savedTheme;document.getElementById('themePicker').value=savedTheme;render();
</script>
</body></html>
